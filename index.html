<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Maison Buffet · Control</title>
<style>
:root{--negro:#1f1f1f;--gris:#8a8a8a;--gris-claro:#e9e9e7;--dorado:#d8b979;--dorado-txt:#e7cf93;--fondo:#f3f1ec;--card:#fff;--linea:#dcd8cf}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--negro);font-size:15px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;background:#000;color:#fff}
h1{font-size:19px;margin:0;color:var(--dorado-txt);letter-spacing:.04em}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:13px;margin:16px 0 8px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.config{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.config label{font-size:13px;color:#ccc;display:flex;align-items:center;gap:6px}
.config input{width:100px;padding:6px 8px;border:1px solid #444;border-radius:6px;background:#2b2b2b;color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:#ccc;border:1px solid #444}
nav button.on{background:var(--dorado);color:var(--negro);border-color:var(--dorado)}
#guardado{font-size:12px;color:#9a9a9a}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--gris-claro);color:var(--negro)}
button:hover{filter:brightness(.96)}
button.pri{background:var(--negro);color:var(--dorado-txt)}
button.oro{background:var(--dorado);color:var(--negro)}
button.sec{background:var(--gris);color:#fff}
button.peligro{background:#fff;color:#a33;border:1px solid #d9b3b3}
.sb{padding:3px 10px;font-weight:700;background:var(--gris-claro)}
input,select{font:inherit}
.input{padding:7px 9px;border:1px solid var(--linea);border-radius:6px;background:#fff}
/* MESAS */
#vistaMesas{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px;max-width:1200px;margin:0 auto;align-items:start}
@media(max-width:860px){#vistaMesas{grid-template-columns:1fr}}
.salon{background:var(--card);border-radius:12px;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px;align-content:start}
.mesa{cursor:pointer;justify-self:center;width:100%;max-width:170px;transition:transform .12s}
.mesa:hover{transform:translateY(-2px)}
.mesa svg{width:100%;height:auto;display:block}
.mesa.sel svg{filter:drop-shadow(0 0 3px var(--dorado)) drop-shadow(0 0 6px var(--dorado))}
.panel{background:var(--card);border-radius:12px;padding:16px;position:sticky;top:16px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--gris-claro)}
.tag.ocupada{background:var(--dorado)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--linea)}
.row small{color:var(--gris);display:block}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:22px;text-align:center}
.lista{max-height:340px;overflow:auto}
.total{display:flex;justify-content:space-between;font-size:18px;margin:14px 0;padding-top:10px;border-top:2px solid var(--negro)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acciones button{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--fondo);border-radius:10px;padding:10px}
.stat span{display:block;font-size:12px;color:var(--gris)}
.stat b{font-size:18px}
.muted{color:var(--gris);font-size:13px}
/* PRODUCTOS */
#vistaProductos{max-width:800px;margin:16px auto;padding:0 16px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
.form-prod{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-prod .input{flex:1;min-width:140px}
.fila-prod{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--linea)}
.fila-prod .input.nom{flex:1}
.fila-prod .input.pre{width:130px}
/* CIERRE */
#vistaCierre{max-width:900px;margin:16px auto;padding:0 16px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:640px){.cards3{grid-template-columns:1fr}}
.cards3 .stat b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linea)}
th{font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
tr.total-row td{font-weight:700;border-top:2px solid var(--negro);border-bottom:none}
.encabezado-cierre{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
/* MODALES */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:10;padding:16px}
.modal-box{background:#fff;border-radius:12px;padding:18px;max-height:90vh;overflow:auto;width:100%;max-width:340px}
.metodos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metodos button{padding:12px}
#ticket{width:300px;font-family:"Courier New",monospace;font-size:13px;color:#000;background:#fff;padding:12px}
#ticket h2{text-align:center;letter-spacing:.1em}
#ticket .c{text-align:center;margin:2px 0}
#ticket .small{font-size:11px}
#ticket .t-line{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
#ticket hr{border:0;border-top:1px dashed #000;margin:8px 0}
#ticket .t-total{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.modal-acc{display:flex;gap:8px;margin-top:12px}
.modal-acc button{flex:1}
@media print{
  .noprint{display:none!important}
  body:not(.pc) #ticket,body:not(.pc) #ticket *{visibility:visible}
  body:not(.pc) *{visibility:hidden}
  body:not(.pc) #ticket,body:not(.pc) #ticket *{visibility:visible}
  body:not(.pc) #ticket{position:absolute;left:0;top:0;width:80mm}
  body:not(.pc) .modal{background:none;display:block!important;position:static}
  body:not(.pc) .modal-box{box-shadow:none;padding:0;max-height:none;max-width:none}
  body.pc *{visibility:hidden}
  body.pc #vistaCierre,body.pc #vistaCierre *{visibility:visible}
  body.pc #vistaCierre{position:absolute;left:0;top:0;width:100%;margin:0;padding:0}
  body.pc header{display:none}
}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(10,8,6,.45),rgba(10,8,6,.65))}
header{background:rgba(8,6,4,.8)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,162,39,.4)}
.salon,.panel,.card,.stat,.modal-box{background:rgba(252,249,243,.93)!important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel{border:1px solid rgba(201,162,39,.3)}
.input{background:rgba(255,255,255,.97)}
@media print{body::before,body::after{display:none!important}body{background:#fff!important}.salon,.panel,.card,.stat{background:#fff!important;box-shadow:none;backdrop-filter:none}}

/* ===== Ajuste: paneles transparentes, texto blanco ===== */
.salon,.panel{background:rgba(0,0,0,.28)!important;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:none!important;border:1px solid rgba(255,255,255,.12)}
.salon,.panel,.panel *{color:#fff}
.panel .muted,.salon .muted{color:rgba(255,255,255,.8)!important}
.panel .stat{background:rgba(255,255,255,.08)!important;box-shadow:none;backdrop-filter:none}
.panel .stat *{color:#fff}
.panel .stat .muted{color:rgba(255,255,255,.7)!important}
.panel h3,.panel h2{color:#fff}
.panel button.oro{color:var(--negro)}
@media print{.salon,.panel{background:#fff!important;color:#000!important}.salon *,.panel *{color:#000!important}}

/* Nombres de mozos: dorado sobre fondo oscuro */
.panel button.mz{background:rgba(0,0,0,.35);color:#d8b979;border:1px solid rgba(201,162,39,.7);font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.panel button.mz:hover{background:rgba(201,162,39,.18)}
.panel button.mz.oro{background:#d8b979;color:#1a1408;border-color:#d8b979;text-shadow:none}

/* Cantidad de comensales: número dorado y más grande */
.panel .step b{color:#d8b979;font-size:20px;min-width:28px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.panel .step button.sb{background:rgba(0,0,0,.35);color:#d8b979;border:1px solid rgba(201,162,39,.7)}

/* Inputs del panel (cantidad de comensales, precio): dorado como los mozos */
.panel input.input{background:rgba(0,0,0,.35);color:#d8b979;border:1px solid rgba(201,162,39,.7);font-weight:700;font-size:18px}
.panel input.input::placeholder{color:rgba(216,185,121,.55)}
/* Botones secundarios del panel (ej. Volver al resumen): legibles sobre el fondo */
.panel button:not(.pri):not(.peligro):not(.oro):not(.mz):not(.sb){background:rgba(0,0,0,.35);color:#d8b979;border:1px solid rgba(201,162,39,.5)}

/* ===== Tipografía blanca y botones blancos (ajuste final) ===== */
*{color:#fff}
h1{color:var(--dorado-txt)}
.muted{color:rgba(255,255,255,.78)!important}
.card,.stat,.panel,.salon,.cards3 .stat{background:rgba(0,0,0,.42)!important;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-box{background:rgba(10,8,6,.94)!important;border:1px solid rgba(255,255,255,.25)}
.input,select,textarea{background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid rgba(255,255,255,.6)!important}
::placeholder{color:rgba(255,255,255,.55)!important}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
table,th,td{color:#fff!important;border-color:rgba(255,255,255,.25)!important}
th{border-bottom:1px solid rgba(255,255,255,.35)!important}
button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.75)}
button:hover{background:rgba(255,255,255,.2);filter:none}
button.pri,button.oro{background:#fff;color:#111;border:1px solid #fff;font-weight:600}
button.sec{background:rgba(255,255,255,.22);color:#fff}
button.peligro{background:transparent;color:#fff;border:1px solid #fff}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7)}
nav button.on{background:#fff;color:#111;border-color:#fff}
.panel button:not(.pri):not(.peligro):not(.oro):not(.mz):not(.sb){background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.75)}
.panel button.mz{background:rgba(0,0,0,.35);color:#d8b979;border:1px solid rgba(201,162,39,.7)}
.panel button.mz.oro{background:#d8b979;color:#1a1408;border-color:#d8b979}
.panel .step b{color:#d8b979}
@media print{
  *{color:#000!important;background:transparent!important;border-color:#000!important;box-shadow:none!important;text-shadow:none!important;backdrop-filter:none!important}
  body{background:#fff!important}
  h1{color:#000!important}
}

/* ===== Banner del logo: ancho completo y centrado ===== */
header{background:#000!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:0 0 12px!important;border-bottom:1px solid rgba(201,162,39,.4)}
header h1{width:100%;display:flex;justify-content:center;align-items:center;margin:0;padding:0;background:#000}
header h1 img{width:auto!important;height:75px!important;max-width:100%;display:block;margin:0 auto}
header nav,header .config{padding:0 14px}
header > *:not(h1){margin-left:auto;margin-right:auto}
@media(max-width:600px){header h1 img{height:55px!important}}

/* ===== Tipografía un poco más grande ===== */
body{font-size:17px!important}
h2{font-size:21px!important}
h3{font-size:15px!important}
.config label,label{font-size:15px!important}
#guardado{font-size:14px!important}
.muted{font-size:15px}
button{font-size:16px}
.stat span{font-size:14px}
.stat b{font-size:22px}

/* Mesas cobradas */
#vistaCerradas{max-width:1000px;margin:16px auto;padding:0 16px}
.cerradas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* Comanda en pantalla: papel blanco con texto negro */
#ticket{background:#fff!important;color:#000!important}
#ticket *{color:#000!important;background:transparent!important;text-shadow:none!important;border-color:#000}
</style>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const KEY = 'buffet_restaurante_v2';
const METODOS = ['Efectivo','Débito','Crédito','Transferencia','Mercado Pago','QR'];

const $ = id => document.getElementById(id);
const num = v => parseFloat(v) || 0;
const fmt = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const hora = t => t ? new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '-';
const hoy = () => new Date().toLocaleDateString('en-CA');
const diaDe = f => new Date(f).toLocaleDateString('en-CA');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function nuevaMesa(id){
  return {id, estado:'libre', personas:0, adultos:0, ninos:0, pequenos:0, precio:0, precioNino:0, precioPequeno:0, items:[], apertura:null, cierre:null, metodo:null, mozo:null};
}
function datosIniciales(){
  return {
    config:{precio:15000, precioNino:7500, precioPequeno:0, nMesas:12, mozos:['Martin','Paola','Andrea']},
    productos:[
      {id:nid(), n:'Bebida', p:3000},
      {id:nid(), n:'Gaseosa', p:2000},
      {id:nid(), n:'Postre', p:2500},
      {id:nid(), n:'Café', p:1500}
    ],
    mesas:Array.from({length:12}, (_,i) => nuevaMesa(i+1)),
    ventas:[]
  };
}

let S = {...datosIniciales(), vista:'mesas', sel:null, pendiente:null, fechaCierre:null};

/* ---------- Persistencia ---------- */
function guardar(){
  programarGuardadoNube();
  try{
    localStorage.setItem(KEY, JSON.stringify({config:S.config, productos:S.productos, mesas:S.mesas, ventas:S.ventas, caja:S.caja, dias:S.dias}));
    $('guardado').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('guardado').textContent = 'ERROR al guardar';
  }
}
function cargar(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    S.config = d.config; S.productos = d.productos; S.mesas = d.mesas; S.ventas = d.ventas; S.caja = d.caja || null; S.dias = d.dias || {};
    return true;
  }catch(e){ return false; }
}

/* ---------- Helpers de datos ---------- */
function ensureMesa(m){
  if(m.adultos == null) m.adultos = m.personas || 0;
  m.ninos = m.ninos || 0;
  m.pequenos = m.pequenos || 0;
  if(m.precioNino == null) m.precioNino = 0;
  if(m.precioPequeno == null) m.precioPequeno = 0;
  m.personas = m.adultos + m.ninos + m.pequenos;
  return m;
}
function mesa(id){ const m = S.mesas.find(x => x.id === id); return m ? ensureMesa(m) : m; }
function totalMesa(m){
  return m.adultos * m.precio + m.ninos * m.precioNino + m.pequenos * m.precioPequeno + m.items.reduce((a,i) => a + i.p * i.c, 0);
}

/* ---------- Vista ---------- */
function setVista(v){ S.vista = v; renderAll(); }

/* ---------- Mesas ---------- */
function setPrecioConfig(v){ S.config.precio = num(v); renderAll(); }

function setMesas(n){
  n = Math.max(1, Math.min(60, parseInt(n) || 1));
  const actual = S.mesas.length;
  if(n > actual){
    let next = Math.max(0, ...S.mesas.map(m => m.id)) + 1;
    for(let k = actual; k < n; k++) S.mesas.push(nuevaMesa(next++));
  } else if(n < actual){
    const quitar = S.mesas.slice(n);
    if(quitar.some(m => m.estado !== 'libre')){
      alert('Hay mesas con cuenta abierta o cobrada. Borrá la cuenta o liberá esas mesas antes de quitarlas.');
      $('nmesas').value = actual;
      return;
    }
    S.mesas = S.mesas.slice(0, n);
  }
  S.config.nMesas = n;
  if(S.sel !== null && !mesa(S.sel)) S.sel = null;
  renderAll();
}

function borrarMesa(id){
  const m = mesa(id);
  if(m.estado === 'ocupada'){
    alert('La mesa ' + id + ' tiene una cuenta abierta. Primero borrá la cuenta.');
    return;
  }
  if(!confirm('¿Borrar la mesa ' + id + ' del salón? Las ventas ya cobradas no se modifican.')) return;
  S.mesas = S.mesas.filter(x => x.id !== id);
  S.sel = null;
  renderAll();
}

function seleccionar(id){ S.sel = id; renderAll(); }

function abrirMesa(id){
  const m = mesa(id);
  m.estado = 'ocupada';
  m.adultos = parseInt($('personasNueva').value) || 1;
  m.ninos = parseInt($('ninosNueva').value) || 0;
  m.pequenos = parseInt($('pequenosNueva').value) || 0;
  m.personas = m.adultos + m.ninos + m.pequenos;
  m.precio = S.config.precio;
  m.precioNino = S.config.precioNino || 0;
  m.precioPequeno = S.config.precioPequeno || 0;
  m.apertura = Date.now();
  m.items = [];
  renderAll();
}

function setPrecioMesa(id, v){ mesa(id).precio = num(v); renderAll(); }

function cambiarPersonas(id, d){ cambiarTipo(id, 'adultos', d); }
function cambiarTipo(id, tipo, d){
  const m = mesa(id);
  const min = tipo === 'adultos' ? 1 : 0;
  m[tipo] = Math.max(min, (m[tipo] || 0) + d);
  m.personas = m.adultos + m.ninos + m.pequenos;
  renderAll();
}
function setPrecioTipo(id, campo, v){ mesa(id)[campo] = num(v); renderAll(); }

function cambiarItem(mid, pid, d){
  const m = mesa(mid);
  const prod = S.productos.find(x => x.id === pid);
  if(!prod) return;
  let it = m.items.find(i => i.pid === pid);
  if(!it){
    if(d <= 0) return;
    it = {pid, n:prod.n, p:prod.p, c:0};
    m.items.push(it);
  }
  it.c += d;
  if(it.c <= 0) m.items = m.items.filter(i => i !== it);
  renderAll();
}

function cobrar(id){
  S.pendiente = id;
  $('pagoTotal').textContent = fmt(totalMesa(mesa(id)));
  $('pagoBtns').innerHTML = METODOS.map((m,i) =>
    `<button class="${i===0?'oro':''}" onclick="confirmarCobro('${m}')">${m}</button>`).join('');
  $('pagoModal').style.display = 'flex';
}
function cancelarCobro(){
  S.pendiente = null;
  $('pagoModal').style.display = 'none';
}
function confirmarCobro(metodo){
  const id = S.pendiente;
  if(id == null) return;
  const m = mesa(id);
  const total = totalMesa(m);
  m.estado = 'pagada';
  m.cierre = Date.now();
  m.metodo = metodo;
  S.ventas.push({
    id: nid(),
    fecha: new Date().toISOString(),
    mesa: id,
    personas: m.personas,
    adultos: m.adultos, ninos: m.ninos, pequenos: m.pequenos,
    precioPersona: m.precio, precioNino: m.precioNino, precioPequeno: m.precioPequeno,
    items: m.items.map(i => ({n:i.n, p:i.p, c:i.c})),
    total,
    metodo,
    mozo: nombreMozo(m.mozo) || 'Sin asignar'
  });
  S.mesas = S.mesas.map(x => x.id === id ? nuevaMesa(id) : x);
  S.sel = null;
  S.pendiente = null;
  $('pagoModal').style.display = 'none';
  renderAll();
  mostrarComanda(id);
}

function liberar(id){
  const m = mesa(id);
  const msg = m.estado === 'pagada'
    ? 'Liberar la mesa ' + id + '?'
    : 'Liberar la mesa ' + id + ' sin cobrar? Se borran sus consumos.';
  if(!confirm(msg)) return;
  S.mesas[S.mesas.findIndex(x => x.id === id)] = nuevaMesa(id);
  S.sel = null;
  renderAll();
}

function reiniciarDia(){
  if(!confirm('Esto libera todas las mesas. Las ventas ya cobradas se conservan en el cierre de caja. ¿Continuar?')) return;
  S.mesas = S.mesas.map(m => nuevaMesa(m.id));
  S.sel = null;
  renderAll();
}


function resetDia(){
  const hoyStr = hoy();
  const ventasHoy = S.ventas.filter(v => diaDe(v.fecha) === hoyStr).length;
  if(!confirm('RESET DÍA: las ventas de hoy (' + ventasHoy + ') se guardan en "Días guardados" del Cierre de caja, se liberan las mesas y la caja queda sin apertura. ¿Continuar?')) return;
  const deHoy = S.ventas.filter(v => diaDe(v.fecha) === hoyStr);
  if(!S.dias) S.dias = {};
  S.dias[hoyStr] = {ventas: deHoy, caja: S.caja, guardado: new Date().toISOString()};
  S.ventas = S.ventas.filter(v => diaDe(v.fecha) !== hoyStr);
  S.mesas = S.mesas.map(m => nuevaMesa(m.id));
  S.caja = {apertura:null, cierre:null};
  S.sel = null;
  guardar();
  renderAll();
  alert('Día reseteado. Todo quedó en 0. El día quedó guardado en "Días guardados" del Cierre de caja.');
}

  $('salon').innerHTML = S.mesas.map(m =>

function asignarMozo(mid, id){
  const m = mesa(mid);
  m.mozo = (m.mozo === id) ? null : id;
  renderAll();
}
function mozoHTML(m){
  const botones = S.config.mozos.length
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap">${S.config.mozos.map(w =>
        `<button class="mz ${m.mozo === w.id ? 'oro' : ''}" onclick="asignarMozo(${m.id},'${w.id}')">${esc(w.n)}</button>`).join('')}</div>`

  S.config.mozos.push({id, n});

}

function filaTipo(m, tipo, etiqueta, campo, precio, editable){
  return `<div class="row"><span>${etiqueta}</span>
      <div class="step">
        ${editable ? `<button class="sb" onclick="cambiarTipo(${m.id},'${tipo}',-1)">−</button>` : ''}

        ${editable ? `<button class="sb" onclick="cambiarTipo(${m.id},'${tipo}',1)">+</button>` : ''}
      </div></div>
      <div class="row"><span class="muted">Precio</span>
        ${editable
          ? `<input class="input" type="number" min="0" step="100" value="${precio}" style="width:120px" onchange="setPrecioTipo(${m.id},'${campo}',this.value)">`
          : `<b>${fmt(precio)}</b>`}
      </div>`;
}

function renderCerradas(){
  const hoyStr = hoy();

  const total = vs.reduce((a,v) => a + v.total, 0);
  $('vistaCerradas').innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <h3>Mesas cobradas hoy</h3>
      <div class="row"><span>Mesas cobradas</span><b>${vs.length}</b></div>
      <div class="row"><span>Total cobrado</span><b>${fmt(total)}</b></div>
    </div>
    ${vs.length ? `<div class="cerradas-grid">${vs.map(v => `
      <div class="card">
        <h3>Mesa ${v.mesa} · ${hora(v.fecha)}</h3>
        <div class="row"><span>Mozo</span><b>${esc(v.mozo || 'Sin asignar')}</b></div>
        <div class="row"><span>Personas</span><b>${v.personas}</b></div>
        <div class="row"><span>Medio de pago</span><b>${esc(v.metodo)}</b></div>
        <div class="row"><span>Total</span><b>${fmt(v.total)}</b></div>
        <div class="acciones" style="margin-top:8px"><button class="sec" onclick="mostrarComandaVenta('${v.id}')">Ver comanda</button></div>
      </div>`).join('')}</div>`
    : '<p class="muted">Todavía no se cobró ninguna mesa hoy.</p>'}`;
}

function renderPanel(){
  const p = $('panel');

  if(S.sel === null){
    const hoyStr = hoy();
    const ventasHoy = S.ventas.filter(v => diaDe(v.fecha) === hoyStr);
    const ocupadas = S.mesas.filter(m => m.estado === 'ocupada');
    const personas = ventasHoy.reduce((a,v) => a + v.personas, 0) + ocupadas.reduce((a,m) => a + m.personas, 0);
    const cobrado = ventasHoy.reduce((a,v) => a + v.total, 0);
    p.innerHTML = `
      <h2>Resumen del día</h2>
      <div class="stats">
        <div class="stat"><span>Mesas ocupadas</span><b>${ocupadas.length}</b></div>
        <div class="stat"><span>Mesas cobradas</span><b>${ventasHoy.length}</b></div>
        <div class="stat"><span>Personas</span><b>${personas}</b></div>
        <div class="stat"><span>Total cobrado</span><b>${fmt(cobrado)}</b></div>
      </div>
      <p class="muted">Tocá una mesa para abrirla o cargarle consumos.</p>
      <div class="acciones" style="flex-direction:column;align-items:stretch"><button class="peligro" onclick="reiniciarDia()">Liberar todas las mesas</button><button class="peligro" onclick="resetDia()">Reset día</button></div>`;
    return;
  }

  const m = mesa(S.sel);
  const editable = m.estado === 'ocupada';
  const etiqueta = {libre:'Libre', ocupada:'Ocupada', pagada:'Pagada'}[m.estado];
  let html = `<div class="ph"><h2>Mesa ${m.id}</h2><span class="tag ${m.estado}">${etiqueta}</span></div>`;
  html += mozoHTML(m);

  if(m.estado === 'libre'){
    html += `
      <p class="muted">Precio por persona: <b>${fmt(S.config.precio)}</b></p>
      <h3>Comensales</h3>
      <div class="acciones">
        <label style="flex:1">Adultos (9+) <input id="personasNueva" class="input" type="number" min="1" value="2" style="width:70px"></label>
        <label style="flex:1">Niños (5 a 8) <input id="ninosNueva" class="input" type="number" min="0" value="0" style="width:70px"></label>
        <label style="flex:1">Menores de 5 <input id="pequenosNueva" class="input" type="number" min="0" value="0" style="width:70px"></label>
      </div>
      <div class="acciones"><button class="pri" onclick="abrirMesa(${m.id})">Abrir mesa</button>
      </div>
      <div class="acciones"><button class="peligro" onclick="borrarMesa(${m.id})">Borrar mesa</button></div>`;
  } else {
    html += `
      <h3>Comensales y precio</h3>
      ${filaTipo(m, 'adultos', 'Adultos (9+ años)', 'precio', m.precio, editable)}
      ${filaTipo(m, 'ninos', 'Niños (5 a 8 años)', 'precioNino', m.precioNino, editable)}
      ${filaTipo(m, 'pequenos', 'Menores de 5 años', 'precioPequeno', m.precioPequeno, editable)}
      <p class="muted">Subtotal comensales: ${fmt(m.adultos*m.precio + m.ninos*m.precioNino + m.pequenos*m.precioPequeno)}</p>`;

    html += `<h3>${editable ? 'Consumos' : 'Detalle'}</h3><div class="lista">`;
    if(editable){
      if(S.productos.length === 0) html += `<p class="muted">Todavía no cargaste productos. Andá a "Productos".</p>`;
      html += S.productos.map(pr => {
        const it = m.items.find(i => i.pid === pr.id);
        const c = it ? it.c : 0;
        return `<div class="row">
          <span>${esc(pr.n)}<small>${fmt(pr.p)}</small></span>
          <div class="step">
            <button class="sb" onclick="cambiarItem(${m.id},'${pr.id}',-1)">−</button>
            <b>${c}</b>
            <button class="sb" onclick="cambiarItem(${m.id},'${pr.id}',1)">+</button>
          </div>
        </div>`;
      }).join('');
    } else {
      html += m.items.length
        ? m.items.map(i => `<div class="row"><span>${i.c} x ${esc(i.n)}<small>${fmt(i.p)} c/u</small></span><b>${fmt(i.p*i.c)}</b></div>`).join('')
        : `<p class="muted">Sin consumos extra</p>`;
    }
    html += `</div>`;

    html += `<div class="total"><span>Total</span><b>${fmt(totalMesa(m))}</b></div>
      <div class="acciones">
        <button onclick="mostrarComanda(${m.id})">Ver comanda</button>
        ${editable
          ? `<button class="oro" onclick="cobrar(${m.id})">Cobrar</button>
             <button class="peligro" onclick="liberar(${m.id})">Borrar cuenta</button>`
          : `<button class="peligro" onclick="liberar(${m.id})">Liberar mesa</button>
          <button class="peligro" onclick="borrarMesa(${m.id})">Borrar mesa</button>`}
      </div>`;
  }

  html += `<p style="margin-top:14px"><button onclick="S.sel=null;renderAll()">← Volver al resumen</button></p>`;
  p.innerHTML = html;
}

/* ---------- Render: Productos ---------- */
function agregarProducto(){
  const n = $('pNom').value.trim();
  const p = num($('pPrecio').value);
  if(!n){ alert('Escribí el nombre del producto'); return; }
  S.productos.push({id:nid(), n, p});
  renderAll();
}
function renombrarProducto(id, v){
  const pr = S.productos.find(x => x.id === id);
  pr.n = v.trim() || pr.n;
  S.mesas.forEach(m => { if(m.estado === 'ocupada') m.items.forEach(i => { if(i.pid === id) i.n = pr.n; }); });
  renderAll();
}
function cambiarPrecioProducto(id, v){
  const pr = S.productos.find(x => x.id === id);
  pr.p = num(v);
  S.mesas.forEach(m => { if(m.estado === 'ocupada') m.items.forEach(i => { if(i.pid === id) i.p = pr.p; }); });
  renderAll();
}
function eliminarProducto(id){
  const enUso = S.mesas.some(m => m.estado === 'ocupada' && m.items.some(i => i.pid === id));
  if(enUso){ alert('Este producto está cargado en una mesa abierta. Cobrá o liberá esa mesa primero.'); return; }
  const pr = S.productos.find(x => x.id === id);
  if(!confirm('Eliminar "' + pr.n + '"?')) return;
  S.productos = S.productos.filter(x => x.id !== id);
  renderAll();
}
function nombreMozo(id){
  const w = S.config.mozos.find(x => x.id === id);
  return w ? w.n : '';
}
function normalizarMozos(){
  const originales = S.config.mozos || [];
  S.config.mozos = originales.map(x => typeof x === 'string' ? {id:nid(), n:x} : x);
  if(!S.config.nombresActualizados){
    const nuevos = ['Martin','Paola','Andrea'];
    S.config.mozos.forEach((w,i) => { if(/^Mozo [123]$/.test(w.n) && nuevos[i]) w.n = nuevos[i]; });
    S.config.nombresActualizados = true;
  }
  S.mesas.forEach(m => {
    if(typeof m.mozo === 'number') m.mozo = S.config.mozos[m.mozo] ? S.config.mozos[m.mozo].id : null;
  });
}
function agregarMozo(){
  const n = $('mNom').value.trim();
  if(!n){ alert('Escribí el nombre del mozo'); return; }
  S.config.mozos.push({id:nid(), n});
  renderAll();
}
function renombrarMozo(id, v){
  const w = S.config.mozos.find(x => x.id === id);
  if(w) w.n = v.trim() || w.n;
  renderAll();
}
function eliminarMozo(id){
  const w = S.config.mozos.find(x => x.id === id);
  if(!w) return;
  if(!confirm('Eliminar a ' + w.n + '? Si está asignado a mesas, esas mesas quedan sin mozo.')) return;
  S.mesas.forEach(m => { if(m.mozo === id) m.mozo = null; });
  S.config.mozos = S.config.mozos.filter(x => x.id !== id);
  renderAll();
}

/* ---------- Render: Cierre de caja ---------- */

const fechaHora = iso => iso ? new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
function abrirCaja(){
  if(!S.caja) S.caja = {apertura:null, cierre:null};
  if(!S.dias) S.dias = {};
  if(S.caja.apertura && !S.caja.cierre){
    if(!confirm('La caja está abierta desde ' + fechaHora(S.caja.apertura) + '. ¿Querés reemplazar la apertura por la hora de ahora?')) return;
  }
  S.caja = {apertura: new Date().toISOString(), cierre: null};
  guardar(); renderAll();
  alert('Caja abierta: ' + fechaHora(S.caja.apertura));
}
function cerrarCaja(){
  if(!S.caja || !S.caja.apertura){ alert('Primero abrí la caja con el botón Apertura de caja.'); return; }
  S.caja.cierre = new Date().toISOString();
  guardar(); renderAll();
  alert('Caja cerrada: ' + fechaHora(S.caja.cierre));
}

function recuperarDia(dia){
  const d = S.dias && S.dias[dia];
  if(!d) return;
  if(!confirm('Recuperar el día ' + dia + ' (' + d.ventas.length + ' ventas). Se suman a las ventas actuales sin duplicar. ¿Continuar?')) return;
  const ids = new Set(S.ventas.map(v => v.id));
  d.ventas.forEach(v => { if(!ids.has(v.id)) S.ventas.push(v); });
  if((!S.caja || !S.caja.apertura) && d.caja && d.caja.apertura) S.caja = d.caja;
  guardar(); renderAll();
  alert('Día ' + dia + ' recuperado.');
}
function borrarDiaGuardado(dia){
  if(!S.dias || !S.dias[dia]) return;
  if(!confirm('Borrar definitivamente el día ' + dia + ' guardado? No se puede deshacer.')) return;
  delete S.dias[dia];
  guardar(); renderAll();
}
function renderDiasGuardados(){
  const dias = Object.keys(S.dias || {}).sort().reverse();
  if(!dias.length) return '<div class="card" style="margin-bottom:12px"><h3>Días guardados</h3><p class="muted">Todavía no hay días guardados. Al usar Reset día, las ventas quedan acá.</p></div>';
  return `<div class="card" style="margin-bottom:12px"><h3>Días guardados</h3>
    ${dias.map(k => { const d = S.dias[k]; const t = d.ventas.reduce((a,v) => a + v.total, 0);
      return `<div class="row"><span>${k} · ${d.ventas.length} mesas · ${fmt(t)}</span>
        <span><button class="sec" onclick="recuperarDia('${k}')">Recuperar</button> <button class="peligro" onclick="borrarDiaGuardado('${k}')">Borrar</button></span></div>`; }).join('')}
  </div>`;
}
function setFechaCierre(v){ S.fechaCierre = v; renderAll(); }

function cardMozos(vs){
  const nombres = [...S.config.mozos.map(w => w.n), 'Sin asignar'];
  const filas = nombres.map(n => {
    const xs = vs.filter(v => (v.mozo || 'Sin asignar') === n);
    return {n, c:xs.length, p:xs.reduce((a,v) => a + v.personas, 0), t:xs.reduce((a,v) => a + v.total, 0)};
  }).filter(r => r.c > 0);
  if(!filas.length) return '';
  return `<div class="card"><h3>Ventas por mozo</h3><table>
    <thead><tr><th>Mozo</th><th class="num">Mesas</th><th class="num">Pers.</th><th class="num">Total</th></tr></thead>
    <tbody>${filas.map(r => `<tr><td>${esc(r.n)}</td><td class="num">${r.c}</td><td class="num">${r.p}</td><td class="num">${fmt(r.t)}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function renderCierre(){
  const dia = S.fechaCierre || hoy();
  const vs = S.ventas.filter(v => diaDe(v.fecha) === dia).sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
  const total = vs.reduce((a,v) => a + v.total, 0);
  const personas = vs.reduce((a,v) => a + v.personas, 0);

  const porMetodo = METODOS.map(m => {
    const xs = vs.filter(v => v.metodo === m);
    return {m, n:xs.length, t:xs.reduce((a,v) => a + v.total, 0)};
  });

  const consumos = {};
  vs.forEach(v => v.items.forEach(i => {
    if(!consumos[i.n]) consumos[i.n] = {c:0, t:0};
    consumos[i.n].c += i.c;
    consumos[i.n].t += i.p * i.c;
  }));
  const topConsumos = Object.entries(consumos).sort((a,b) => b[1].t - a[1].t);

  $('vistaCierre').innerHTML = `
    <div class="encabezado-cierre">
      <h2>Cierre de caja</h2>
      <div class="acciones noprint" style="margin:0">
        <input id="fechaCierreIn" type="date" class="input" value="${dia}" onchange="setFechaCierre(this.value)">
        <button class="pri" onclick="imprimirCierre()">Imprimir cierre</button>
        <button class="pri" onclick="exportarExcel()">Descargar Excel</button>
        <input id="mesExcel" type="month" class="input" style="width:170px"> <button class="pri" onclick="exportarMes()">Excel del mes</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="row"><span>Apertura de caja</span><b>${S.caja && S.caja.apertura ? fechaHora(S.caja.apertura) : 'No registrada'}</b></div>
      <div class="row"><span>Cierre de caja</span><b>${S.caja && S.caja.cierre ? fechaHora(S.caja.cierre) : 'Pendiente'}</b></div>
      <div class="acciones noprint" style="margin-top:8px"><button class="pri" onclick="cerrarCaja()">Registrar cierre de caja</button></div>
    </div>

    ${renderDiasGuardados()}
    <div class="cards3">
      <div class="stat"><span>Mesas cobradas</span><b>${vs.length}</b></div>
      <div class="stat"><span>Personas</span><b>${personas}</b></div>
      <div class="stat"><span>Total cobrado</span><b>${fmt(total)}</b></div>
    </div>

    ${vs.length === 0 ? `<div class="card"><p class="muted">No hay cobros registrados en esta fecha.</p></div>` : ''}

    <div class="card">
      <h3>Desglose por medio de pago</h3>
      <table>
        <thead><tr><th>Medio</th><th class="num">Cobros</th><th class="num">Monto</th></tr></thead>
        <tbody>
          ${porMetodo.map(r => `<tr><td>${r.m}</td><td class="num">${r.n}</td><td class="num">${fmt(r.t)}</td></tr>`).join('')}
          <tr class="total-row"><td>Total</td><td class="num">${vs.length}</td><td class="num">${fmt(total)}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>Detalle de cobros</h3>
      ${vs.length ? `
      <table>
        <thead><tr><th>Hora</th><th>Mesa</th><th class="num">Pers.</th><th>Medio</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${vs.map(v => `<tr><td>${hora(v.fecha)}</td><td>${v.mesa}</td><td class="num">${v.personas}</td><td>${esc(v.metodo)}</td><td class="num">${fmt(v.total)}</td></tr>`).join('')}
        </tbody>
      </table>` : `<p class="muted">Sin cobros.</p>`}
    </div>

    <div class="card">
      <h3>Consumos extra vendidos</h3>
      ${topConsumos.length ? `
      <table>
        <thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Monto</th></tr></thead>
        <tbody>
          ${topConsumos.map(([n,d]) => `<tr><td>${esc(n)}</td><td class="num">${d.c}</td><td class="num">${fmt(d.t)}</td></tr>`).join('')}
        </tbody>
      </table>` : `<p class="muted">Sin consumos extra.</p>`}

    <div class="card noprint">

      <div class="acciones">
        <button onclick="exportarDatos()">Exportar respaldo</button>

        <button onclick="mostrarPegar()">Pegar respaldo como texto</button>

function exportarExcel(periodo){
  const dia = periodo || S.fechaCierre || hoy();
  const vs = S.ventas.filter(v => diaDe(v.fecha).startsWith(dia)).sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
  const suma = k => vs.reduce((a,v) => a + (v[k] || 0), 0);
  const totalCobrado = vs.reduce((a,v) => a + v.total, 0);
  const txt = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const n = v => Number(v || 0).toLocaleString('es-AR');
  const money = v => '$ ' + n(v);
  const tabla = (titulo, cols, filas, numCols = [], total = null) => `
    <h3>${txt(titulo)}</h3>
    <table>
      <tr>${cols.map((c,i) => `<th class="${numCols.includes(i) ? 'num' : ''}">${txt(c)}</th>`).join('')}</tr>
      ${filas.map(f => `<tr>${f.map((c,i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${txt(c)}</td>`).join('')}</tr>`).join('')}
      ${total ? `<tr class="tot">${total.map((c,i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${txt(c)}</td>`).join('')}</tr>` : ''}
    </table>`;

  const resumen = [
    ['Mesas cobradas', vs.length],
    ['Adultos (9 años o más)', suma('adultos')],
    ['Niños (5 a 8 años)', suma('ninos')],
    ['Menores de 5 años', suma('pequenos')],
    ['Personas total', suma('personas')],
    ['Total cobrado', money(totalCobrado)],
    ['Apertura de caja', S.caja && S.caja.apertura ? fechaHora(S.caja.apertura) : 'No registrada'],
    ['Cierre de caja', S.caja && S.caja.cierre ? fechaHora(S.caja.cierre) : 'Pendiente']
  ];

  const cobros = vs.map(v => [diaDe(v.fecha), hora(v.fecha), v.mesa, v.mozo || '', n(v.adultos ?? v.personas), n(v.ninos || 0), n(v.pequenos || 0), n(v.personas), v.metodo, money(v.total)]);

  const medios = METODOS.map(m => {
    const xs = vs.filter(v => v.metodo === m);
    return [m, xs.length, money(xs.reduce((a,v) => a + v.total, 0))];
  });

  const mozos = {};
  vs.forEach(v => { const k = v.mozo || 'Sin asignar'; mozos[k] = mozos[k] || {n:0,p:0,t:0}; mozos[k].n++; mozos[k].p += v.personas; mozos[k].t += v.total; });
  const filasMozos = Object.entries(mozos).map(([k,o]) => [k, o.n, o.p, money(o.t)]);

  const cons = {};
  vs.forEach(v => (v.items || []).forEach(i => { cons[i.n] = cons[i.n] || {c:0,t:0}; cons[i.n].c += i.c; cons[i.n].t += i.p * i.c; }));
  const filasCons = Object.entries(cons).sort((a,b) => b[1].t - a[1].t).map(([k,o]) => [k, o.c, money(o.t)]);

  const cuerpo = `
    <h1>La Maison Buffet</h1>
    <p class="sub">Reporte de ventas · ${txt(dia)}</p>
    ${tabla('Resumen', ['Concepto','Valor'], resumen, [1])}
    ${tabla('Detalle de cobros', ['Fecha','Hora','Mesa','Mozo','Adultos','Niños (5-8)','Menores de 5','Personas','Medio de pago','Total'], cobros, [2,4,5,6,7,9], ['Total','','','','','','',n(suma('personas')),'',money(totalCobrado)])}
    ${tabla('Por medio de pago', ['Medio de pago','Cantidad','Total'], medios, [1,2], ['Total', vs.length, money(totalCobrado)])}
    ${tabla('Por mozo', ['Mozo','Mesas','Personas','Total'], filasMozos, [1,2,3])}
    ${tabla('Consumos extra', ['Producto','Cantidad','Monto'], filasCons, [1,2])}`;

  const estilo = `
    body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1f1a14}
    h1{color:#8a6d1d;font-size:22pt;margin:0}
    .sub{color:#6b5a3a;margin:2px 0 14px}
    h3{color:#8a6d1d;font-size:13pt;margin:18px 0 6px;border-bottom:2px solid #c9a227}
    table{border-collapse:collapse;min-width:420px}
    th{background:#1f1a14;color:#d8b979;font-weight:bold;border:1px solid #8a6d1d;padding:6px 10px;text-align:left}
    td{border:1px solid #cfc7b5;padding:5px 10px;background:#fffdf7}
    tr:nth-child(even) td{background:#f7f2e6}
    .num{text-align:right}
    tr.tot td{background:#efe3bd;font-weight:bold;border-top:2px solid #8a6d1d}`;

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><style>${estilo}</style></head><body>${cuerpo}</body></html>`;

  const blob = new Blob(['\uFEFF' + html], {type:'application/vnd.ms-excel;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reporte-' + dia + '.xls';
  document.body.appendChild(a); a.click(); a.remove();
}


function exportarDatos(){
  const blob = new Blob([JSON.stringify({config:S.config, productos:S.productos, mesas:S.mesas, ventas:S.ventas}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'buffet-respaldo-' + hoy() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function aplicarRespaldo(txt){
  try{
    const d = JSON.parse(txt);
    if(!d.mesas || !d.productos || !d.ventas || !d.config) throw new Error('formato');
    if(!confirm('Esto reemplaza TODOS los datos actuales por los del respaldo. ¿Continuar?')) return;
    S.config = d.config; S.productos = d.productos; S.mesas = d.mesas; S.ventas = d.ventas; S.caja = d.caja || null; S.dias = d.dias || {};
    S.sel = null;
    renderAll();
    alert('Respaldo importado correctamente.');
  }catch(e){
    alert('El respaldo no es válido. Revisá que se haya copiado completo, desde { hasta }.');
  }
}

function importarDatos(input){
  const f = input.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => aplicarRespaldo(reader.result);
  reader.readAsText(f);
  input.value = '';
}

function cargarCarta(){
  let agregados = 0;
  CARTA_INICIAL.forEach(c => {
    if(!S.productos.some(p => p.n.toLowerCase() === c.n.toLowerCase())){
      S.productos.push({id:nid(), n:c.n, p:c.p});
      agregados++;
    }
  });
  renderAll();
  alert(agregados + ' productos agregados. Los que ya existían no se tocaron. Revisá los precios y editá lo que haga falta.');

let SB = null, NUBE_LISTA = false, saveTimer = null;
function iniciarSupabase(){
  if(window.supabase && typeof SUPA_URL !== 'undefined' && SUPA_URL && !SUPA_URL.includes('TU-PROYECTO')){
    SB = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  }
}
function payloadActual(){ return {config:S.config, productos:S.productos, mesas:S.mesas, ventas:S.ventas, caja:S.caja, dias:S.dias}; }
function programarGuardadoNube(){
  if(!SB || !NUBE_LISTA) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const {error} = await SB.from('estado').upsert({id:'lamaison', data:payloadActual(), updated_at:new Date().toISOString()});
    $('guardado').textContent = error ? 'ERROR al guardar en la nube, revisá la conexión' : 'Guardado en la nube ' + new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }, 500);
}
async function cargarDeNube(){
  const {data, error} = await SB.from('estado').select('data').eq('id','lamaison').maybeSingle();
  if(error){ alert('No se pudo leer la nube: ' + error.message); return false; }
  if(data && data.data){
    const d = data.data;
    S.config = d.config; S.productos = d.productos; S.mesas = d.mesas; S.ventas = d.ventas || []; S.caja = d.caja || null; S.dias = d.dias || {};
  }
  return true;
}
async function arranqueNube(){
  $('login').style.display = 'none';
  const ok = await cargarDeNube();
  if(!ok){ $('login').style.display = 'flex'; return; }
  NUBE_LISTA = true;
  renderAll();
  programarGuardadoNube();
}
async function iniciarSesion(){
  const {error} = await SB.auth.signInWithPassword({email: $('loginEmail').value.trim(), password: $('loginPass').value});
  if(error){ $('loginErr').textContent = 'Email o contraseña incorrectos.'; return; }
  $('loginErr').textContent = '';
  arranqueNube();
}
async function cerrarSesion(){ if(SB) await SB.auth.signOut(); location.reload(); }
function exportarMes(){
  const m = $('mesExcel').value;
  if(!m){ alert('Elegí un mes primero.'); return; }
  exportarExcel(m);
}

if(!cargar()){
  const d = datosIniciales();
  S.config = d.config; S.productos = d.productos; S.mesas = d.mesas; S.ventas = d.ventas; S.caja = d.caja || null; S.dias = d.dias || {};
}
renderAll();
iniciarSupabase();
if(SB){
  SB.auth.getSession().then(({data:{session}}) => { if(session) arranqueNube(); else $('login').style.display = 'flex'; });
} else {
  NUBE_LISTA = true;
}
</script>
</body>
</html>
